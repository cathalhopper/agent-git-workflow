# Project settings for scripts/finish.* and scripts/setup.*.
#
# One KEY=value per line. No quotes, no variable expansion, no spaces around the
# equals sign. Lines starting with # are ignored. Every key has a default, so a
# missing key - or a missing file - changes nothing. Both the bash and the
# PowerShell scripts read this file, so it holds only plain values.
#
# Branch names are validated before they reach git: a value with a space, a
# leading dash or ".." is a usage error, never a guess.

# Banner text only.
PROJECT_NAME=this repository

# The branch work lands on. Empty means origin/HEAD, falling back to main.
DEFAULT_BASE=

# Long-lived branches a feature branch may target instead of the default,
# comma-separated. A branch that contains one of these is finished onto it.
# One the default contains - a main that develop merges from - is ignored:
# use BASE_BY_PREFIX for it. See docs/development/starting-new-work.md section 4.3.
ALT_BASES=

# Branch prefixes that always land on one base, as comma-separated prefix:base
# pairs, such as hotfix:main when work lands on develop and main is released
# from it. Each prefix also counts as a branch type for the pull request title.
BASE_BY_PREFIX=

# Branch-name prefixes, comma-separated. The pull request title is built from
# the prefix and the claim commit's subject.
BRANCH_TYPES=feat,fix,spike,docs,chore

# The one command that runs every local check. Quoted in messages; never
# executed by finish.*, which does not run tests and does not claim to.
CHECK_COMMAND=./scripts/check.sh
CHECK_COMMAND_WINDOWS=.\scripts\check.ps1

# Paths that are flagged when changed, and must be acknowledged with
# --acknowledge before a pull request opens. Comma-separated. Lockfiles match
# by file name anywhere in the tree; governing paths are glob patterns from the
# repository root.
LOCKFILES=Cargo.lock,package-lock.json,pnpm-lock.yaml,yarn.lock,poetry.lock,Gemfile.lock,go.sum,composer.lock
GOVERNING_PATHS=.gitattributes,.gitignore,.github/*,scripts/*

# An extended regular expression OR'd onto the built-in debug-scaffolding scan.
# Empty means the built-in pattern alone.
SCAFFOLDING_PATTERN=

# Added plus deleted lines above which the bare run reports a "large diff".
LARGE_DIFF_LINES=2000
