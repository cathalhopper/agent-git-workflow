# workflow.conf for a project with an alternate base branch and a pinned
# toolchain. Copy over scripts/workflow.conf to reproduce it.

PROJECT_NAME=Tsunami Defence

DEFAULT_BASE=main

# Throwaway prototype code lands here and never on main. A branch cut from it is
# finished onto it; a branch equally distant from both is refused.
ALT_BASES=spike/a0-prototype

BRANCH_TYPES=feat,fix,spike,docs,chore

CHECK_COMMAND=./scripts/check.sh
CHECK_COMMAND_WINDOWS=.\scripts\check.ps1

LOCKFILES=Cargo.lock,package-lock.json

# rust-toolchain.toml pins the compiler; a change to it is a rule change for
# everyone, so it sits beside the other governing paths.
GOVERNING_PATHS=.gitattributes,.gitignore,.github/*,scripts/*,rust-toolchain.toml

SCAFFOLDING_PATTERN=

LARGE_DIFF_LINES=2000
